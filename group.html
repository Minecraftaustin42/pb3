<!DOCTYPE html>
<html>
<head>
    <title>Playsculpt Group</title>
</head>
<body style="font-family:Arial;background:white;text-align:center;color:#333;">

    <h1 id="groupName" style="color:blue;">Loading Group...</h1>
    <div><a href="/groups.html" style="color:blue;">Groups</a> <a href="/home.html" style="color:purple;">Home</a></div>

    <div id="groupBox" style="border:2px solid purple;background:#f5f5f5;max-width:750px;margin:15px auto;padding:15px;">Loading...</div>

<script>
const groupId = new URLSearchParams(window.location.search).get("groupId");
let group = null;

async function joinGroup() {
    const data = await (await fetch("/api/groups/" + groupId + "/join", { method: "POST" })).json();
    alert(data.success ? "Joined group!" : data.message);
    loadGroup();
}

async function leaveGroup() {
    const data = await (await fetch("/api/groups/" + groupId + "/leave", { method: "POST" })).json();
    alert(data.success ? "Left group." : data.message);
    loadGroup();
}

async function postAnnouncement() {
    const message = document.getElementById("announcementInput").value;
    const data = await (await fetch("/api/groups/" + groupId + "/announce", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
    })).json();
    alert(data.success ? "Announcement posted." : data.message);
    loadGroup();
}

async function deleteGroup() {
    if (!confirm("Delete this group forever?")) return;
    const data = await (await fetch("/api/groups/" + groupId + "/delete", { method: "POST" })).json();
    if (data.success) window.location.href = "/groups.html";
    else alert(data.message);
}

async function loadGroup() {
    const response = await fetch("/api/groups/" + groupId);
    const data = await response.json();
    if (!data.success) { document.body.innerHTML = data.message; return; }
    group = data.group;
    document.getElementById("groupName").innerText = group.name;

    let membersHtml = "";
    group.members.forEach(member => {
        membersHtml += `<div style="border:1px solid gray;background:white;margin:4px;padding:6px;"><a href="/user/${member.userId}" style="color:blue;">${member.username}</a></div>`;
    });

    let announcementsHtml = "<p>No announcements yet.</p>";
    if (group.announcements.length > 0) {
        announcementsHtml = "";
        group.announcements.forEach(item => {
            announcementsHtml += `<div style="border:1px solid blue;background:white;margin:6px;padding:8px;text-align:left;">
                <p>${item.message}</p><small style="color:gray;">${new Date(item.createdAt).toLocaleString()}</small>
            </div>`;
        });
    }

    document.getElementById("groupBox").innerHTML = `
        <p>${group.description || "No description."}</p>
        <p><b>Owner:</b> ${group.ownerUsername} | <b>Members:</b> ${group.members.length}</p>
        ${group.isMember ? `<button onclick="leaveGroup()" style="background:gray;color:white;border:none;padding:8px;">Leave Group</button>` : `<button onclick="joinGroup()" style="background:blue;color:white;border:none;padding:8px;">Join Group</button>`}
        ${group.isOwner ? `<button onclick="deleteGroup()" style="background:purple;color:white;border:none;padding:8px;margin-left:8px;">Abandon/Delete Group</button>` : ""}
        <h2 style="color:blue;">Announcements</h2>
        ${group.isOwner ? `<textarea id="announcementInput" maxlength="300" placeholder="Post announcement" style="width:90%;height:60px;"></textarea><br><button onclick="postAnnouncement()" style="background:blue;color:white;border:none;padding:8px;margin:8px;">Post Announcement</button>` : ""}
        ${announcementsHtml}
        <h2 style="color:blue;">Members</h2>${membersHtml}
    `;
}

loadGroup();
</script>

</body>
</html>
