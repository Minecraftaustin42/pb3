<!DOCTYPE html>
<html>
<head>
    <title>Play Playsculpt Game</title>
</head>
<body style="font-family:Arial;background:white;text-align:center;color:#333;">

    <h1 id="gameTitle" style="color:blue;">Loading Game...</h1>
    <div><a href="/games.html" style="color:blue;">Games</a> <a href="/home.html" style="color:purple;">Home</a> <a id="editLink" href="#" style="display:none;color:purple;">Edit</a></div>
    <p style="color:gray;">Move with WASD or arrow keys. This 3D scene uses only HTML divs and CSS transforms.</p>
    <p id="rewardMessage" style="color:purple;"></p>

    <!-- 3D CSS play area -->
    <div id="scene" style="height:520px;margin:15px auto;max-width:900px;background:#dbeafe;border:3px solid blue;overflow:hidden;perspective:750px;position:relative;">
        <div id="world" style="position:absolute;left:50%;top:50%;width:1200px;height:1200px;background:#e5e7eb;transform-style:preserve-3d;border:3px solid #999;"></div>
        <div id="player" style="position:absolute;left:50%;top:50%;width:32px;height:48px;background:#6b5cff;border:2px solid #333;transform:translate(-50%,-50%);z-index:5;"></div>
    </div>

<script>
const gameId = new URLSearchParams(window.location.search).get("gameId");
let game = null;
let me = null;
let playerX = 0;
let playerY = 0;
const keys = {};

function makeObject(object) {
    let width = 50;
    let height = 50;
    let z = 35;
    let text = "";
    let radius = "0";
    if (object.type === "platform") { width = 110; height = 110; z = 6; }
    if (object.type === "sign") { width = 95; height = 65; z = 50; text = object.name; }
    if (object.type === "coin") { width = 35; height = 35; z = 45; text = "🪙"; radius = "20px"; }

    return `<div style="position:absolute;left:${600 + Number(object.x)}px;top:${600 + Number(object.y)}px;width:${width}px;height:${height}px;background:${object.color};border:2px solid #333;border-radius:${radius};transform:translateZ(${z}px);display:flex;align-items:center;justify-content:center;color:white;font-size:12px;text-align:center;">${text}</div>`;
}

function avatarColor() {
    return me && me.avatar ? me.avatar.color : "#6b5cff";
}

function renderWorld() {
    let html = "";
    (game.objects || []).forEach(object => { html += makeObject(object); });
    document.getElementById("world").innerHTML = html;
    document.getElementById("player").style.background = avatarColor();
}

function updateCamera() {
    const world = document.getElementById("world");
    world.style.transform = `translate(-50%,-50%) rotateX(65deg) translate3d(${-playerX}px, ${-playerY}px, 0px)`;
}

function gameLoop() {
    if (keys.ArrowUp || keys.w) playerY -= 4;
    if (keys.ArrowDown || keys.s) playerY += 4;
    if (keys.ArrowLeft || keys.a) playerX -= 4;
    if (keys.ArrowRight || keys.d) playerX += 4;
    playerX = Math.max(-550, Math.min(550, playerX));
    playerY = Math.max(-550, Math.min(550, playerY));
    updateCamera();
    requestAnimationFrame(gameLoop);
}

async function awardPlayReward() {
    const response = await fetch("/api/games/" + gameId + "/play-reward", { method: "POST" });
    const data = await response.json();
    if (data.success) {
        if (data.earnedPoints > 0) document.getElementById("rewardMessage").innerText = "You earned " + data.earnedPoints + " Points for playing!";
        else document.getElementById("rewardMessage").innerText = "Reward already claimed for this game.";
    }
}

async function loadGame() {
    me = await (await fetch("/me")).json();
    const response = await fetch("/api/games/" + gameId);
    const data = await response.json();
    if (!data.success) { document.body.innerHTML = data.message; return; }
    game = data.game;
    document.getElementById("gameTitle").innerText = game.title + " by " + game.creatorUsername;
    if (game.isCreator) {
        document.getElementById("editLink").style.display = "inline";
        document.getElementById("editLink").href = "/edit-game.html?gameId=" + gameId;
    }
    renderWorld();
    updateCamera();
    awardPlayReward();
}

document.addEventListener("keydown", event => { keys[event.key] = true; keys[event.key.toLowerCase()] = true; });
document.addEventListener("keyup", event => { keys[event.key] = false; keys[event.key.toLowerCase()] = false; });

loadGame();
gameLoop();
</script>

</body>
</html>
