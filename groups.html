<!DOCTYPE html>
<html>
<head>
    <title>Playsculpt Groups</title>
</head>
<body style="font-family:Arial;background:white;text-align:center;color:#333;">

    <h1 style="color:blue;">Groups</h1>
    <div><a href="/home.html" style="color:blue;">Home</a> <a href="/create-group.html" style="color:purple;">Create Group</a></div>
    <p style="color:gray;">Creating a group costs 100 SculptCoins.</p>
    <div id="groupsList" style="max-width:750px;margin:15px auto;">Loading...</div>

<script>
async function loadGroups() {
    const response = await fetch("/api/groups");
    const data = await response.json();
    if (!data.success) { window.location.href = "/auth.html"; return; }
    let html = "";
    if (data.groups.length === 0) html = "<p>No groups yet.</p>";
    data.groups.forEach(group => {
        html += `<div style="border:2px solid purple;background:#f5f5f5;margin:10px;padding:12px;text-align:left;">
            <h2 style="color:blue;margin:0;">${group.name}</h2>
            <p>${group.description || "No description."}</p>
            <p><b>Owner:</b> ${group.ownerUsername} | <b>Members:</b> ${group.memberCount}</p>
            <button onclick="location.href='/group.html?groupId=${group.groupId}'" style="background:purple;color:white;border:none;padding:8px;">Open Group</button>
        </div>`;
    });
    document.getElementById("groupsList").innerHTML = html;
}
loadGroups();
</script>

</body>
</html>
